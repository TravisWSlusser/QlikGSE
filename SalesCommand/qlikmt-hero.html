<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qlik Sales Enablement — Home</title>
<!-- ===========================================================================
  SECTIONED VIEWS — one file, four Mindtickle widgets. Never fork this file.
    (no param)          full standalone page, everything renders
    ?section=topbar     theme toggle + beta strip, quick links beneath
    ?section=ticker     Current News crawl + Markets ribbon
    ?section=highlights logo/title + highlights rotator (2fr) | greeting stack (1fr)
    ?section=hubs       hub tabs + tiles
  Exactly one view fetches news/markets per document. See BOOT GATING below.
  Adding a section = a visibility block at the END of the stylesheet + a SHOW_*
  flag. Nothing else.
  =========================================================================== -->
<script>
(function(){var s=new URLSearchParams(location.search).get('section');
  if(s)document.documentElement.setAttribute('data-section',s);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,900;1,900&family=Inter:wght@400;500;600&family=Share+Tech+Mono&family=Playfair+Display:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
  /* Content lives in the DESTINATIONS array at the bottom.
     Mindtickle deep-links go in each "href". Layout never needs editing. */
  :root{
    --cat-review:#FF6B35; --cat-training:#10CFC9; --cat-deadline:#FF6B6B;
    --cat-event:#00A651;  --cat-content:#9B59FF;
    --tgl-h:30px;        /* theme toggle height — the beta rect matches it */
    --quote-h:74px;      /* locked quote box — never let it reflow */
    --news-speed:130s;   /* news crawl — higher = slower */
    --mkt-speed:150s;    /* markets ribbon */

    --navy-0:#0B1F33; --navy-1:#11304D; --navy-2:#19426C;
    --green:#00A651; --sky:#10CFC9;
    --cat-review:#FF6B35; --cat-training:#10CFC9; --cat-deadline:#FF6B6B; --cat-event:#00A651; --cat-content:#9B59FF;
    --ink:#EDF3F9; --muted:#90A6BD;
    --line:rgba(255,255,255,.10);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{overflow-x:clip}
  body{
    font-family:'Inter',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(140% 120% at 88% -10%, #1b4670 0%, var(--navy-2) 26%, var(--navy-1) 58%, var(--navy-0) 100%);
    min-height:100vh;position:relative;overflow-x:clip;
    padding-inline:clamp(16px,4vw,56px);
    transition:background .35s ease, color .35s ease;
  }
  /* faint brand contrail behind the glass panel */
  .contrail{position:absolute;pointer-events:none;z-index:0}
  .contrail svg{display:block;width:100%;height:auto;overflow:visible}
  .contrail path{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
  .contrail.draw path{animation:draw 11s cubic-bezier(.33,0,.2,1) forwards}
  .contrail.draw path:nth-child(2){animation-delay:1.4s}
  .contrail.draw path:nth-child(3){animation-delay:2.8s}
  .contrail.draw path:nth-child(4){animation-delay:4.2s}
  @keyframes draw{to{stroke-dashoffset:0}}
  .c-top{top:-2%;right:-2%;width:64%;max-width:920px;opacity:.24}

  .wrap{position:relative;z-index:2;max-width:1120px;
    margin:clamp(16px,3vw,40px) auto;
    padding:clamp(24px,3.4vw,46px) clamp(28px,4vw,50px);
    background:rgba(255,255,255,.028);
    border:1px solid rgba(255,255,255,.08);
    border-radius:clamp(22px,3vw,34px);
    box-shadow:0 18px 50px -34px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(32px) saturate(118%);
    -webkit-backdrop-filter:blur(32px) saturate(118%)}

  .hotlinks{position:relative;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    font-size:13px;padding:10px 52px 10px 10px;border:1px solid var(--line);border-radius:14px;
    background:rgba(255,255,255,.03);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  [data-theme="light"] .hotlinks{background:rgba(255,255,255,.42);border-color:rgba(15,40,70,.12)}
  .hotlinks .themetoggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);margin:0}
  .hotlinks a{color:var(--muted);text-decoration:none;letter-spacing:.02em;transition:color .2s}
  .hotlinks a:hover{color:var(--sky)}

  /* ---- top line: theme toggle hard left, beta strip fills the rest ---- */
  /* the beta rect now rides inside the quick-links bubble, pinned left, so the
     links stay optically centred on the bubble rather than on leftover space */
  /* Beta rect stays IN FLOW. It must keep position:relative or its ::before
     caution stripe escapes to .hotlinks and paints down the whole bubble. */
  .hotlinks .beta-strip{position:relative;flex:0 0 auto;margin:0;
    padding:0 13px 0 17px;gap:0;height:var(--tgl-h);
    flex-direction:row;align-items:center;justify-content:center}
  .beta-row{display:flex;align-items:center;gap:8px;line-height:1}
  /* Links centre on the bubble itself, not on the space left over, so the beta
     rect's width has no effect on where they sit. */
  .hl-links{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;align-items:center;justify-content:center;gap:20px;white-space:nowrap}

  /* ---- highlights rotator (manager-controlled posts) ---- */
  /* two containers: the text stack, and a reserved media panel on the right */
  .hl{position:relative;display:grid;min-width:0;height:100%;
    grid-template-columns:minmax(0,1fr) 0;grid-template-rows:minmax(0,1fr) auto;
    column-gap:0;transition:none;
    border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);padding:clamp(12px,1.6vw,18px)}
  .hl.has-media{grid-template-columns:minmax(0,1fr) clamp(120px,22%,190px);column-gap:20px}
  /* square slot, cropped to a circle; sits centred in its column */
  .hl-media{grid-column:2;grid-row:1 / span 2;display:none;
    width:100%;aspect-ratio:1 / 1;align-self:center;justify-self:center;
    overflow:hidden;border-radius:50%;
    border:1px solid var(--line);background:rgba(255,255,255,.04)}
  .hl.has-media .hl-media{display:block}
  .hl-media img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
  [data-theme="light"] .hl-media{background:rgba(15,40,70,.05);border-color:rgba(15,40,70,.12)}
  [data-theme="light"] .hl{background:rgba(255,255,255,.42);border-color:rgba(15,40,70,.12)}
  .hl-stage{position:relative;grid-column:1;grid-row:1;min-height:clamp(130px,13vw,180px)}
  .hl-item{position:absolute;left:0;right:0;top:0;opacity:0;transform:translateY(8px);
    transition:opacity .5s ease, transform .5s ease;pointer-events:none}
  .hl-item.on{opacity:1;transform:none;pointer-events:auto}
  .hl-kicker{font-family:'Barlow Condensed';font-weight:500;font-size:12px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--sky);display:inline-flex;align-items:center;gap:7px}
  .hl-kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sky);flex:0 0 auto}
  .hl-title{font-family:'Barlow Condensed';font-weight:600;line-height:1.04;
    font-size:clamp(30px,4.2vw,50px);letter-spacing:-.01em;margin:.22em 0 .3em;text-wrap:balance}
  .hl-title .ac{color:var(--green)}
  .hl-body{font-size:clamp(14px,1.4vw,16px);line-height:1.55;color:#bccfe2;max-width:560px}
  [data-theme="light"] .hl-body{color:#42566c}
  .hl-ctas{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;margin-top:14px}
  .hl-cta{display:inline-flex;align-items:center;gap:6px;font-size:13px;
    color:var(--sky);text-decoration:none;border-bottom:1px solid rgba(16,207,201,.35);padding-bottom:2px}
  .hl-cta:hover{border-bottom-color:var(--sky)}
  .hl-dots{grid-column:1;grid-row:2;display:flex;gap:7px;margin-top:14px}
  .hl-dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;cursor:pointer;
    background:var(--line);transition:background .2s, transform .2s}
  .hl-dots button:hover{background:var(--muted)}
  .hl-dots button.on{background:var(--sky);transform:scale(1.25)}

  /* ---- upcoming events strip ---- */
  .hr-bodyL{display:flex;flex-direction:column;gap:12px;align-self:stretch}
  .hl{flex:1 1 auto}
  /* The frame is sized at runtime to exactly one .clk card so its top and
     bottom line up with the lower world-clock row. See syncUeHeight(). */
  .ue{flex:0 0 auto;border:1px solid var(--line);border-radius:14px;
    background:rgba(255,255,255,.03);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    padding:5px;box-sizing:border-box}
  [data-theme="light"] .ue{background:rgba(255,255,255,.42);border-color:rgba(15,40,70,.12)}
  .ue-row{display:grid;grid-template-columns:repeat(3,minmax(0,auto));gap:8px;height:100%}
  .ue-row.open{grid-template-columns:1fr}
  /* placeholder slot — same treatment as an out-of-hours world clock */
  .ue-chip.empty{background:rgba(6,16,28,.5);border-color:rgba(255,255,255,.05);
    opacity:.42;cursor:default;pointer-events:none}
  .ue-chip{display:flex;align-items:center;gap:12px;min-width:0;width:100%;height:100%;cursor:pointer;
    border:1px solid var(--uec,var(--line));border-left:3px solid var(--uec,var(--sky));
    border-radius:9px;background:rgba(255,255,255,.03);padding:4px 12px;
    font-size:12px;letter-spacing:.02em;color:var(--ink);text-align:left;
    transition:background .18s,border-color .18s}
  .ue-chip:hover{background:rgba(255,255,255,.07)}
  [data-theme="light"] .ue-chip{background:rgba(255,255,255,.5)}
  [data-theme="light"] .ue-chip:hover{background:#fff}
  .ue-date{font-weight:700;white-space:nowrap;flex:0 0 auto}
  .ue-title{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto}
  .kd-row.open .ue-title{margin-left:0}
  .ue-detail{flex:1 1 auto;min-width:0;color:var(--muted);font-size:12.5px;
    letter-spacing:0;text-transform:none;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border-left:1px solid var(--uec,var(--line));padding-left:14px}
  .ue-x{flex:0 0 auto;width:22px;height:22px;border:0;background:none;cursor:pointer;
    color:var(--muted);padding:0;line-height:1}
  .ue-x:hover{color:var(--ink)}
  .ue-x svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
  .ue-legend{grid-column:1;grid-row:3;display:flex;flex-wrap:wrap;justify-content:flex-end;
    gap:12px;font-size:9.5px;letter-spacing:.02em;color:var(--muted);padding-top:7px}
  .ue-leg{display:inline-flex;align-items:center;gap:5px}
  .ue-leg i{width:6px;height:6px;border-radius:50%;background:var(--uec);display:inline-block}
  .herorow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);column-gap:34px;
    row-gap:clamp(6px,0.9vw,12px);align-items:baseline;
    padding:clamp(18px,2.6vw,28px) 0 clamp(12px,2vw,20px)}
  .hr-brandline{grid-column:1/-1;grid-row:1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .hr-brandline .eyebrow{border-left:1px solid var(--line);padding-left:12px}
  .hr-greet{grid-column:2;grid-row:1;text-align:right;position:relative;top:3px}
  .hr-bodyL{grid-column:1;grid-row:2;min-width:0;align-self:stretch}
  .hr-bodyR{grid-column:2;grid-row:2;text-align:right;display:flex;flex-direction:column;align-self:stretch;gap:clamp(10px,1.4vw,14px)}
  .hr-title{margin:0;max-width:680px}
  .hr-bodyL .sub{margin-top:clamp(12px,1.6vw,20px)}
  .hr-bodyR .quote{margin-top:clamp(14px,1.8vw,20px)}
  .brand{display:inline-flex;align-items:baseline;gap:11px;padding:0}
  .brand .logo{height:14px;width:auto;display:block}
  .brand .logo-light{display:none}
  [data-theme="light"] .brand .logo-dark{display:none}
  [data-theme="light"] .brand .logo-light{display:block}
  .logo-fallback{display:none;font-size:16px;font-weight:500;letter-spacing:.03em;color:var(--muted)}
  .logo-fallback b{color:var(--ink);font-weight:500}
  .brand.fb .logo{display:none}
  .brand.fb .logo-fallback{display:inline}
  .keystrip{display:flex;flex-direction:column;align-items:center;gap:11px;margin-top:clamp(16px,2.4vw,26px);
    padding:clamp(12px,1.6vw,16px) clamp(14px,2vw,20px);border:1px solid var(--line);border-radius:16px;
    background:rgba(255,255,255,.03);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .kd-h{font-family:'Barlow Condensed';font-weight:500;font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);text-align:center;margin:0}
  .kd-h span{color:var(--sky)}
  .kd-nav{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
  .kd-row{flex:1 1 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;min-width:0}
  .kd-arrow{flex:0 0 auto;width:28px;height:28px;border:1px solid var(--line);border-radius:8px;
    background:rgba(255,255,255,.04);color:var(--muted);cursor:pointer;font-size:18px;line-height:1;
    display:grid;place-items:center;transition:color .2s ease,border-color .2s ease,background .2s ease}
  .kd-arrow:hover:not(:disabled){color:var(--sky);border-color:rgba(16,207,201,.5);background:rgba(255,255,255,.08)}
  .kd-arrow:disabled{opacity:.35;cursor:default}
  .kd-card{display:flex;align-items:baseline;justify-content:center;gap:7px;padding:6px 12px;border:1px solid var(--line);border-radius:9px;
    background:rgba(255,255,255,.05);cursor:pointer;font:inherit;color:inherit;white-space:nowrap;
    transition:transform .2s ease, border-color .2s ease, background .2s ease}
  .kd-card:hover{transform:translateY(-2px);border-color:rgba(16,207,201,.5);background:rgba(255,255,255,.09)}
  .kd-card:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
  .kd-empty{border:1px solid rgba(255,255,255,.05);border-radius:9px;background:rgba(0,0,0,.12)}
  .kd-m{font-family:'Barlow Condensed';font-weight:500;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--sky)}
  .kd-d{font-family:'Barlow Condensed';font-weight:600;font-size:18px;line-height:1;color:var(--ink)}
  .timecard{text-align:right}
  #greet{display:block;font-family:'Barlow Condensed';font-weight:500;font-size:13px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--sky)}
  #greet .tod svg{width:15px;height:15px;vertical-align:-2px;margin-left:4px;
    fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #clock{display:block;font-family:'Barlow Condensed';font-weight:600;
    font-size:clamp(34px,4vw,44px);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:0}
  /* Fixed box: the quote rotates every 13s and longer ones used to add a line
     and shove everything below it. Height is locked and #qtext shrinks to fit. */
  .quote{margin-top:15px;border-right:2px solid var(--green);padding-right:13px;text-align:right;
    height:var(--quote-h);display:flex;flex-direction:column;justify-content:center;
    align-items:stretch;overflow:hidden}
  .quote #qby{flex:0 0 auto}
  /* no transition on font-size — it makes fitQuote() measure a mid-animation value */
  #qtext{display:block;flex:0 0 auto;line-height:1.42}
  .quote #qtext{display:block;font-size:13px;line-height:1.42;color:var(--muted);text-wrap:balance}
  .quote #qby{display:block;font-size:11px;color:#7d93aa;margin-top:5px;letter-spacing:.04em;transition:opacity .45s}
  .quote .scr{color:var(--sky)}

  .lead{flex:1 1 auto;min-width:0;max-width:680px}
  .eyebrow{font-family:'Barlow Condensed';font-weight:500;font-size:14px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--sky)}
  h1{font-family:'Barlow Condensed';font-weight:600;line-height:1.02;
    font-size:clamp(38px,6vw,68px);letter-spacing:-.01em;margin:.32em 0 .42em;text-wrap:balance}
  h1 .ac{color:var(--green)}
  .sub{font-size:clamp(15px,1.5vw,17px);line-height:1.6;color:#bccfe2;max-width:520px}

  .divider{margin-top:clamp(14px,2.2vw,22px);height:1px;background:var(--line);position:relative}
  
  .qaz-h{font-family:'Barlow Condensed';font-weight:500;font-size:12px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin:clamp(10px,1.6vw,14px) 0 12px;
    display:inline-flex;align-items:center;gap:7px}
  .qaz-h .qh-ic{width:14px;height:14px;flex:0 0 auto;fill:none;stroke:var(--sky);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tiles{display:grid;grid-template-columns:auto 1fr;gap:0 16px;margin-top:16px;padding-bottom:clamp(6px,1vw,12px)}
  .hub-panels{display:grid;padding:10px 0}
  .hub-panel{grid-row:1;grid-column:1;display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr));align-content:start;transition:opacity .15s ease}
  .hub-panel:not(.active){visibility:hidden;opacity:0;pointer-events:none}
  .hub-tabs{display:flex;flex-direction:column;justify-content:center;gap:0;border-right:1px solid var(--line);padding:10px 0}
  .hub-tab{min-width:0;text-align:left;font-family:'Barlow Condensed';font-weight:600;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);background:transparent;
    border:none;border-right:2px solid transparent;border-radius:0;padding:8px 14px 8px 4px;white-space:nowrap;cursor:pointer;
    transition:color .2s ease,border-right-color .2s ease}
  .hub-tab:hover{color:var(--ink);border-right-color:rgba(16,207,201,.35)}
  .hub-tab.active{color:var(--sky);border-right-color:var(--sky);
    box-shadow:none}
  [data-theme="light"] .hub-tab{background:transparent}
  [data-theme="light"] .hub-tab.active{color:#0E8A84;border-right-color:#0E8A84}
  .tile{position:relative;display:flex;align-items:center;gap:11px;min-width:0;
    text-decoration:none;color:inherit;
    background:rgba(255,255,255,.045);border:1px solid var(--line);
    border-radius:var(--radius);padding:5px 11px;
    transition:transform .25s ease, border-color .25s ease, background .25s ease}
  .tile:hover{transform:translateY(-3px);background:rgba(255,255,255,.08);
    border-color:rgba(16,207,201,.55)}
  .tile:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
  .tico{width:30px;height:30px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;
    background:rgba(16,207,201,.1);border:1px solid rgba(16,207,201,.22)}
  .tico svg{width:15px;height:15px;stroke:var(--sky);fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .tbody{flex:1;min-width:0}
  .tile h3{font-family:'Barlow Condensed';font-weight:600;font-size:17px;letter-spacing:.01em;line-height:1.1}
  .tile p{font-size:11.5px;line-height:1.3;color:var(--muted);margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tarrow{flex:0 0 auto;color:var(--muted);font-size:15px;transition:transform .25s ease, color .25s ease}
  .tile:hover .tarrow{transform:translate(2px,-2px);color:var(--sky)}

  /* ---------- LIGHT MODE (variable overrides + card adjustments) ---------- */
  [data-theme="light"]{
    --ink:#0E2742; --muted:#5b7088; --line:rgba(15,40,70,.14);
    --sky:#0E8A84; --green:#00904A;
  }
  [data-theme="light"] body{
    background:radial-gradient(140% 120% at 88% -10%, #ffffff 0%, #eef3f9 42%, #e2eaf2 100%);
  }
  [data-theme="light"] .wrap{background:rgba(255,255,255,.42);
    border-color:rgba(15,40,70,.08);
    box-shadow:0 18px 44px -34px rgba(15,40,70,.22), inset 0 1px 0 rgba(255,255,255,.6)}
  [data-theme="light"] .contrail{opacity:.2}
  [data-theme="light"] .sub{color:#42566c}
  [data-theme="light"] .kd-card{background:#fff;border-color:rgba(15,40,70,.12)}
  [data-theme="light"] .keystrip{background:rgba(15,40,70,.035);border-color:#d7e0ea;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
  [data-theme="light"] .kd-empty{background:rgba(15,40,70,.06);border-color:rgba(15,40,70,.1)}
  [data-theme="light"] .kd-panel{background:#fff}
  [data-theme="light"] .quote #qby{color:#6b7f95}
  [data-theme="light"] .tile{background:#ffffff;border-color:rgba(15,40,70,.12);
    box-shadow:0 1px 2px rgba(15,40,70,.05)}
  [data-theme="light"] .tile:hover{background:#ffffff;border-color:var(--sky);
    box-shadow:0 10px 24px -14px rgba(14,138,132,.55)}
  [data-theme="light"] .tico{background:rgba(14,138,132,.08);border-color:rgba(15,40,70,.12)}

  /* theme toggle */
  .themetoggle{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;
    background:transparent;color:var(--muted);cursor:pointer;transition:color .2s, border-color .2s}
  .themetoggle:hover{color:var(--sky);border-color:rgba(16,207,201,.5)}
  .themetoggle:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
  .themetoggle svg{width:16px;height:16px;fill:none;stroke:currentColor;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- MARKET PULSE strip ---------- */
  /* ---- market ribbon (bottom band of the lower-third) ---- */
  .pulse{display:flex;align-items:center;height:25px;border-top:1px solid rgba(16,207,201,.32);
    background:rgba(255,255,255,.02)}
  .mk-bug{flex:0 0 auto;align-self:stretch;display:flex;align-items:center;justify-content:center;padding:0 14px;
    background:rgba(255,255,255,.05);box-shadow:inset -1px 0 0 var(--line);color:var(--muted);font-family:'Share Tech Mono',monospace;font-weight:400;font-size:11.5px;letter-spacing:.12em}
  .mtape-win{position:relative;flex:1;display:flex;align-items:center;height:100%;overflow:hidden;padding-left:6px;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
  .mtape-track{display:inline-flex;white-space:nowrap;
    animation:marquee var(--mkt-speed) linear infinite}
  .pulse:hover .mtape-track{animation-play-state:paused}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:0 15px;position:relative}
  .chip::after{content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:1px;height:12px;background:var(--line)}
  .c-ico{width:13px;height:13px;flex:0 0 auto;border-radius:3px;overflow:hidden;
    background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:6px;font-weight:600;color:var(--muted)}
  .c-ico img{width:100%;height:100%;object-fit:contain;background:#fff}
  .c-sym{font-family:'Barlow Condensed';font-weight:600;font-size:10.5px;letter-spacing:.04em;color:var(--ink)}
  .c-p{font-size:10.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .c-d{font-size:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .c-d.up{color:#21c46b}
  .c-d.down{color:#ff6b6b}

  /* ---- news ticker — clean scrolling strip ---- */
  /* ---- broadcast lower-third: news crawl (top) + market ribbon (bottom) fused ---- */
  .lowerthird{margin-top:clamp(18px,2.6vw,24px);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;background:rgba(255,255,255,.03);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .lowerthird .ti-title,.lowerthird .c-sym,.lowerthird .c-p{color:var(--ink)}
  .lowerthird .ti-src{color:var(--muted)}
  .lowerthird .chip::after,.lowerthird .ticker-item::after{background:var(--line)}
  [data-theme="light"] .lowerthird{background:#eef2f7;border-color:#cfdae6;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
  [data-theme="light"] .pulse{background:#dde5ee;border-top-color:rgba(16,207,201,.55);box-shadow:inset 0 2px 6px rgba(15,40,70,.12)}
  [data-theme="light"] .c-ico{background:rgba(15,40,70,.08)}
  [data-theme="light"] .ticker-fav{background:rgba(15,40,70,.08)}
  [data-theme="light"] .qnews{background:#ffffff;box-shadow:inset -1px 0 0 rgba(15,40,70,.12)}
  [data-theme="light"] .qnews::before{background:repeating-linear-gradient(45deg,transparent 0 5px,rgba(15,40,70,.05) 5px 6px)}
  [data-theme="light"] .mk-bug{background:#e8edf4;color:#41566d;box-shadow:inset -1px 0 0 rgba(15,40,70,.1)}
  .ticker{display:flex;align-items:center;height:34px}
  .qnews{position:relative;flex:0 0 auto;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;padding:0 18px;background:rgba(255,255,255,.05);box-shadow:inset -1px 0 0 var(--line);overflow:hidden}
  .qnews::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(45deg,transparent 0 5px,rgba(255,255,255,.045) 5px 6px)}
  .qn-kicker{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:7px;letter-spacing:.26em;text-indent:.26em;
    text-transform:uppercase;color:var(--sky);line-height:1}
  .qn-kicker::before,.qn-kicker::after{content:"";width:9px;height:1px;background:currentColor;opacity:.5;flex:0 0 auto}
  .qn-word{position:relative;z-index:1;font-family:'Playfair Display',serif;font-weight:400;font-size:18px;color:var(--ink);
    line-height:1;letter-spacing:.03em}
  .ticker-win{position:relative;flex:1;display:flex;align-items:center;height:100%;overflow:hidden;padding-left:8px;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
  /* --news-speed / --mkt-speed: higher = slower. One knob each. */
  .ticker-track{display:inline-flex;white-space:nowrap;
    animation:marquee var(--news-speed) linear infinite}
  .ticker:hover .ticker-track{animation-play-state:paused}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .ticker-item{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);
    font-size:12px;padding:0 18px;position:relative}
  .ticker-item::after{content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:.5}
  .ticker-fav{width:14px;height:14px;border-radius:3px;flex:0 0 auto;background:rgba(255,255,255,.1)}
  .ti-src{color:var(--muted);font-size:10.5px}
  .ticker-item:hover .ti-title{color:var(--sky)}

  /* ---- world clocks (analog, hands only) ---- */
  .topmeta{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:22px;width:300px;max-width:44%}
  .clocks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:auto}
  .clk{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:12px;
    background:rgba(255,255,255,.05);border:1px solid rgba(16,207,201,.22);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:opacity .5s ease, background .5s ease, border-color .5s ease}
  .clk.closed{background:rgba(6,16,28,.5);border-color:rgba(255,255,255,.05);opacity:.42}
  .cl{width:28px;height:28px;flex:0 0 auto}
  .cl-ring{fill:none;stroke:var(--line);stroke-width:2}
  .cl-h{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
  .cl-m{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
  .cl-s{stroke:var(--sky);stroke-width:1.2;stroke-linecap:round}
  .cl-hub{fill:var(--sky)}
  .clk-txt{min-width:0}
  .clk-country{font-family:'Barlow Condensed';font-weight:500;font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clk-city{font-family:'Barlow Condensed';font-weight:600;font-size:13px;color:var(--ink);line-height:1.15;white-space:nowrap}
  .clk-time{font-size:10px;color:var(--sky);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---- key dates dialog ---- */
  /* ---------- key dates calendar (bottom of page) ---------- */
  .calsec{position:relative;overflow:hidden;margin-top:clamp(20px,3vw,30px);padding:clamp(16px,2vw,22px);
    border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.03);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .sitefoot{max-width:1120px;margin:16px auto 0;padding:0 12px;text-align:center;display:flex;flex-direction:column;gap:6px}
  .sitefoot a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(144,166,189,.25)}
  .sitefoot a:hover{color:var(--sky);border-bottom-color:rgba(16,207,201,.5)}
  .sf-sep{opacity:.4;margin:0 7px}
  .sf-cred{font-size:11px;color:var(--muted)}
  .sf-cred strong{color:#b6c5d6;font-weight:600}
  .sf-u{white-space:nowrap}
  .sf-logo{height:13px;width:auto;display:inline-block;vertical-align:-2px;margin:0 4px;opacity:.92}
  .sf-logo-light{display:none}
  [data-theme="light"] .sf-logo-dark{display:none}
  [data-theme="light"] .sf-logo-light{display:inline-block}
  .sf-logo-fallback{display:none;font-weight:600;color:#b6c5d6}
  .sf-brand.fb .sf-logo{display:none}
  .sf-brand.fb .sf-logo-fallback{display:inline}
  [data-theme="light"] .sf-logo-fallback{color:#2b3a49}
  .sf-tools{font-size:10px;color:rgba(144,166,189,.62)}
  .sf-legal{font-size:9.5px;line-height:1.55;color:rgba(144,166,189,.46);max-width:840px;margin:3px auto 0}
  [data-theme="light"] .sf-cred{color:#5a6b7d}
  [data-theme="light"] .sf-cred strong{color:#2b3a49}
  [data-theme="light"] .sf-tools{color:rgba(90,107,125,.8)}
  [data-theme="light"] .sf-legal{color:rgba(90,107,125,.7)}
  [data-theme="light"] .sitefoot a{border-bottom-color:rgba(90,107,125,.3)}
  .cal-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;
    padding-bottom:11px;border-bottom:1px solid var(--line)}
  .cal-bar-nav{display:flex;align-items:center;gap:6px}
  .cal-otd{flex:1 1 0;min-width:0;overflow:hidden;padding:0 12px;font-size:11.5px;color:var(--muted)}
  .cal-otd.feather{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%)}
  .cal-otd-track{display:inline-flex;white-space:nowrap;will-change:transform}
  .cal-otd-track.scroll{animation:otdScroll linear infinite}
  .cal-otd-track .seg{display:inline-block;white-space:nowrap}
  .cal-otd b{color:var(--sky);font-weight:600}
  .otd-dyk{color:var(--green);font-weight:700;margin-right:5px}
  .otd-sep{display:none}
  .cal-otd-track.scroll .otd-sep{display:inline-block;margin:0 18px;vertical-align:middle}
  .otd-sep svg{width:9px;height:9px;fill:var(--sky);display:block}
  @keyframes otdScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.cal-otd-track.scroll{animation:none}.cal-otd{text-overflow:ellipsis;white-space:nowrap}}
  .cal-datebtn{flex:0 0 auto;height:28px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:rgba(255,255,255,.04);
    color:var(--ink);font-family:'Barlow Condensed';font-weight:600;font-size:12.5px;letter-spacing:.03em;cursor:pointer;white-space:nowrap;transition:border-color .2s,background .2s}
  .cal-datebtn:hover{border-color:rgba(16,207,201,.5);background:rgba(255,255,255,.08)}
  @media (max-width:820px){.cal-otd{display:none}}
  .cal-bar-ic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:var(--sky);stroke-width:1.8;stroke-linecap:round;
    stroke-linejoin:round;margin-right:4px}
  .cal-monthsel{position:relative}
  .cal-month{display:inline-flex;align-items:center;justify-content:center;gap:4px;font-family:'Barlow Condensed';
    font-weight:600;font-size:14px;min-width:0;letter-spacing:.02em;color:var(--ink);background:transparent;
    border:1px solid transparent;border-radius:7px;padding:2px 6px;cursor:pointer;transition:border-color .2s,background .2s}
  .cal-month:hover{border-color:var(--line);background:rgba(255,255,255,.04)}
  .cal-caret{width:11px;height:11px;flex:0 0 auto;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;
    stroke-linejoin:round;transition:transform .2s}
  .cal-month[aria-expanded="true"] .cal-caret{transform:rotate(180deg)}
  .cal-pop{position:absolute;top:calc(100% + 8px);left:0;transform:none;z-index:30;width:236px;
    background:var(--navy-1);border:1px solid var(--line);border-radius:12px;padding:12px;
    box-shadow:0 24px 60px -28px rgba(0,0,0,.7)}
  [data-theme="light"] .cal-pop{background:#fff}
  .cal-pop[hidden]{display:none}
  .cal-pop-yr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-pop-yr span{font-family:'Barlow Condensed';font-weight:600;font-size:16px;letter-spacing:.02em}
  .cal-pop-months{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .cal-mo{font-family:'Barlow Condensed';font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:8px 0;
    cursor:pointer;transition:color .15s,border-color .15s,background .15s}
  .cal-mo:hover{color:var(--ink);border-color:rgba(16,207,201,.5);background:rgba(255,255,255,.06)}
  .cal-mo.sel{color:#04222b;background:var(--sky);border-color:var(--sky)}
  .cal-btn{width:26px;height:26px;flex:0 0 auto;border:1px solid var(--line);border-radius:7px;background:rgba(255,255,255,.04);
    color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:color .2s,border-color .2s,background .2s}
  .cal-btn:hover{color:var(--sky);border-color:rgba(16,207,201,.5);background:rgba(255,255,255,.07)}
  .cal-btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .cal-tbtn{height:26px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:rgba(255,255,255,.04);color:var(--ink);
    font-family:'Barlow Condensed';font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
    transition:color .2s,border-color .2s,background .2s}
  .cal-tbtn:hover{color:var(--sky);border-color:rgba(16,207,201,.5);background:rgba(255,255,255,.07)}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .cal-dow span{font-family:'Barlow Condensed';font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);text-align:center;padding:3px 0}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:6px}
  .cal-cell{position:relative;min-height:58px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.022);
    padding:5px;display:flex;flex-direction:column;gap:3px;overflow:hidden;transition:border-color .2s,background .2s}
  .cal-cell:hover{border-color:rgba(16,207,201,.3);background:rgba(255,255,255,.04)}
  .cal-cell.dim{opacity:.38}
  .cal-num{align-self:flex-end;font-family:'Barlow Condensed';font-weight:600;font-size:12px;color:var(--muted);
    line-height:1;width:19px;height:19px;display:grid;place-items:center;border-radius:50%}
  .cal-cell.today{border-color:rgba(16,207,201,.5)}
  .cal-cell.today .cal-num{background:var(--sky);color:#04222b}
  [data-theme="light"] .cal-cell.today .cal-num{background:#10CFC9;color:#04222b}
  [data-theme="light"] .cal-cell.today{border-color:rgba(16,207,201,.55)}
  .cal-pill{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;cursor:pointer;background:transparent;
    font:inherit;color:var(--ink);padding:2px 5px;border-radius:6px;font-size:11px;line-height:1.2;overflow:hidden;transition:background .15s}
  .cal-pill:hover{background:rgba(255,255,255,.08)}
  .cal-pill .cdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .cal-pill .ct{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-more{font-size:10px;color:var(--muted);font-family:'Barlow Condensed';font-weight:600;letter-spacing:.04em;
    border:0;background:transparent;text-align:left;padding:0 5px}
  .cal-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:13px}
  .cal-legend .lg{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
  .cal-legend .lg .cdot{width:8px;height:8px;border-radius:50%}
  .cal-body{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:clamp(16px,2.2vw,24px);align-items:stretch}
  .cal-main{position:relative;min-width:0}
  .cal-listwrap{position:relative;display:flex;flex-direction:column;flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);
    padding:14px 14px 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .cal-listwrap h2{font-family:'Barlow Condensed';font-weight:500;font-size:12px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .cal-li{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;border:0;background:transparent;
    cursor:pointer;font:inherit;color:var(--ink);padding:9px 6px;border-radius:8px;transition:background .15s}
  .cal-li:hover{background:rgba(255,255,255,.05)}
  .cal-li+.cal-li{border-top:1px solid var(--line)}
  .cal-li .cdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-top:5px}
  .cal-li-body{flex:1;min-width:0}
  .cal-li-t{display:block;font-size:13.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-li-s{display:block;font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.02em}
  .cal-empty{font-size:12px;color:var(--muted);padding:10px 6px}
  .cal-side{display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0}
  .cal-list-vp{overflow:hidden;flex:1 1 auto}
  .cal-list-track{display:flex;transition:transform .35s ease}
  .cal-list-page{flex:0 0 100%;min-width:0}
  .cal-list-pager{display:flex;align-items:center;justify-content:flex-start;gap:8px;margin-top:8px;min-height:28px;padding-left:6px}
  .cal-pgdot{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer;transition:background .2s,transform .2s}
  .cal-pgdot.on{background:var(--sky);transform:scale(1.25)}
  .cal-pgarrow{width:22px;height:22px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
  .cal-pgarrow:hover{color:var(--sky)}
  .cal-pgarrow svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .cal-pgarrow[disabled]{opacity:.25;cursor:default}
  .cal-bb{position:relative;display:flex;flex-direction:column;flex:0 0 auto;border:1px solid var(--line);
    border-radius:12px;overflow:hidden;background:rgba(255,255,255,.03);cursor:default;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .cal-bb--exp{cursor:pointer}
  .cal-cell--spot{z-index:2;border-color:color-mix(in srgb, var(--spot, var(--sky)) 50%, var(--line));
    animation:spotPulse 2.2s ease-in-out infinite}
  @keyframes spotPulse{
    0%,100%{box-shadow:0 0 5px 0 color-mix(in srgb, var(--spot, var(--sky)) 22%, transparent)}
    50%{box-shadow:0 0 16px 3px color-mix(in srgb, var(--spot, var(--sky)) 55%, transparent)}
  }
  @media (prefers-reduced-motion:reduce){.cal-cell--spot{animation:none;box-shadow:0 0 12px 1px color-mix(in srgb, var(--spot, var(--sky)) 40%, transparent)}}
  .cal-bb-eyebrow{position:absolute;top:10px;left:12px;z-index:3;font-family:'Barlow Condensed';font-weight:600;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:#fff;opacity:.92;display:flex;align-items:center;gap:6px;text-shadow:0 1px 4px rgba(0,0,0,.55)}
  .cal-bb-eyebrow .pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--sky);animation:bbpulse 2s infinite}
  @keyframes bbpulse{0%{box-shadow:0 0 0 0 rgba(16,207,201,.5)}70%{box-shadow:0 0 0 7px rgba(16,207,201,0)}100%{box-shadow:0 0 0 0 rgba(16,207,201,0)}}
  .cal-bb-fade{transition:opacity .3s ease}
  .cal-bb-media{position:relative;height:88px;background-size:cover;background-position:center}
  .cal-bb-media::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,18,32,.1),rgba(7,18,32,.82))}
  .cal-bb-cat{position:absolute;bottom:8px;left:12px;z-index:2;display:inline-flex;align-items:center;gap:6px;
    font-family:'Barlow Condensed';font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.55)}
  .cal-bb-cat .cdot{width:7px;height:7px;border-radius:50%}
  .cal-bb-body{padding:11px 13px 12px;min-height:138px}
  .cal-bb-date{font-family:'Barlow Condensed';font-weight:500;font-size:11px;letter-spacing:.06em;color:var(--sky);margin-bottom:3px}

  .kd-modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px}

  .kd-panel .pm{font-family:'Barlow Condensed';font-weight:500;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--sky)}

  .rise{opacity:0;transform:translateY(14px);animation:rise .7s ease forwards}

  @media (max-width:880px){.hub-panel{grid-template-columns:repeat(2,minmax(0,1fr))}}

  .hub-tab.active{border-right-color:transparent;border-bottom-color:var(--sky)}

  .vs-infobox{text-align:right;
    border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);

  [data-theme="light"] .vs-infobox{background:rgba(255,255,255,.42);border-color:rgba(15,40,70,.12)}

  /* ── beta / under-construction strip ── */
  .beta-strip{display:flex;align-items:center;gap:11px;position:relative;overflow:hidden;
    margin:0 0 clamp(12px,1.6vw,18px);padding:9px 16px 9px 22px;border-radius:12px;

    border:1px solid rgba(245,166,35,.30);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .beta-strip::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:11px 0 0 11px;
    background:repeating-linear-gradient(45deg,#F5A623 0 6px,#10243b 6px 12px);
    background-size:auto 17px;animation:beta-stripes 1.1s linear infinite}
  @keyframes beta-stripes{to{background-position:0 -17px}}
  .beta-cone{width:17px;height:17px;flex:0 0 auto;transform-origin:50% 88%;animation:beta-bob 2.6s ease-in-out infinite}
  @keyframes beta-bob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
  .beta-badge{flex:0 0 auto;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:10px;
    letter-spacing:1.3px;text-transform:uppercase;color:#241704;background:#F5A623;border-radius:4px;

  @keyframes beta-glow{0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,0)}50%{box-shadow:0 0 16px -2px rgba(245,166,35,.65)}}
  .beta-txt{font-family:'Inter',system-ui,sans-serif;font-size:12.5px;line-height:1.15;color:var(--muted);white-space:nowrap}
  .beta-txt b{color:#F5A623;font-weight:700}
  [data-theme="light"] .beta-strip{background:linear-gradient(90deg,rgba(245,166,35,.16),rgba(245,166,35,.05));border-color:rgba(216,140,20,.45)}
  [data-theme="light"] .beta-strip::before{background:repeating-linear-gradient(45deg,#E8941A 0 6px,#cfd8e2 6px 12px)}

  /* ---- launch card (mobile collapsed state) ---- */
  .launch{display:none;flex-direction:column;justify-content:space-between;
    min-height:150px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;
    background:linear-gradient(135deg,rgba(16,207,201,.10),rgba(255,255,255,.03) 55%);

  .lc-cta{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;

    background:rgba(16,207,201,.08)}
  .lc-ico{width:15px;height:15px;display:inline-block;flex:0 0 auto}

  @media (prefers-reduced-motion:reduce){.beta-cone,.beta-strip::before,.beta-badge{animation:none}}

  /* True centring and an inline beta rect can't both fit once the bubble gets
     narrow. The rect keeps its cone and badge and drops the wordmark, which
     buys back ~150px and keeps the links dead centre. */
  @media (max-width:1010px){
    .hotlinks .beta-txt{display:none}
    .hotlinks .beta-strip{padding:0 11px 0 15px}
  }
  @media (max-width:700px){

  /* ================= SECTIONED VIEWS — MUST STAY LAST IN THIS STYLESHEET =====
     Each section is its own document in its own Mindtickle widget, so each one
     paints its own background. A flat fill is used instead of the page gradient
     so four stacked widgets read as one continuous surface rather than four
     mismatched slices of the same radial.
     ========================================================================= */
  /* --secpad-x is the single knob for how far content sits off both edges.
     Fixed px, not vw, so all four widgets land on the same line regardless
     of how Mindtickle sizes each one. */
  html[data-section]{--secpad-x:36px}
  @media (max-width:640px){ html[data-section]{--secpad-x:20px} }
  html[data-section] body{background:var(--navy-1);padding-inline:0;min-height:0}
  html[data-section][data-theme="light"] body{background:#eef3f9}
  html[data-section] .wrap{margin:0;max-width:none;
    padding:clamp(14px,1.6vw,20px) var(--secpad-x);border-radius:0;
    background:transparent;border:none;box-shadow:none;
    backdrop-filter:none;-webkit-backdrop-filter:none}
  html[data-section] .contrail{display:none}

  /* hide every top-level block, then re-show only what this section owns.
     The show rules match the hide rule's specificity and come after it. */
  html[data-section] .wrap > *{display:none}

  html[data-section="topbar"] .hotlinks{display:flex}

  html[data-section="ticker"] .lowerthird{display:block;margin-top:0}

  html[data-section="highlights"] .herorow{display:grid;padding-top:0}

  html[data-section="hubs"] .tiles{display:grid;margin-top:0}

  /* ---- ?section=mobile : one widget, two states -------------------------
     data-mode is set from the viewport height. Collapsed inside a Mindtickle
     card it shows the launch card; once expanded it becomes the whole page. */
  html[data-section="mobile"][data-mode="card"] .launch{display:flex}
  html[data-section="mobile"][data-mode="full"] .topline,
  html[data-section="mobile"][data-mode="full"] .hotlinks{display:flex}
  html[data-section="mobile"][data-mode="full"] .lowerthird{display:block;margin-top:12px}
  html[data-section="mobile"][data-mode="full"] .herorow{display:flex;margin-top:12px}
  html[data-section="mobile"][data-mode="full"] .tiles{display:grid;margin-top:14px}

  /* ── stacked layout — sits after the section rules on purpose, because
     html[data-section="highlights"] .herorow{display:grid} would otherwise
     outrank it and keep the two-column grid at narrow widths ──────────────────────────────────────────────────────
     display:contents on .hr-bodyR promotes the greeting and the clocks to
     siblings of .hr-bodyL, so they can be ordered independently: greeting on
     top, then the highlight card, key dates, legend, and the clocks last.   */
  @media (max-width:960px){
    html:not([data-section]) .herorow,
    html[data-section="highlights"] .herorow{display:flex;flex-direction:column;
      align-items:stretch;row-gap:clamp(12px,2vw,16px);column-gap:0;padding-right:0}
    .hr-brandline{order:0}
    .hr-bodyR{display:contents}
    .vs-infobox{order:1}
    .hr-bodyL{order:2;align-self:auto}
    .ue-legend{order:3}
    .clocks{order:4;margin-top:0}
    /* greeting spans the full width of the highlight card but keeps its
       right alignment — it must not flip sides when the layout reorders */
    .vs-infobox{text-align:right;max-width:none;width:100%}
    .quote{border-right:2px solid var(--green);border-left:none;
      padding-right:13px;padding-left:0;text-align:right}
    /* colour key centres while stacked, returns to right-aligned when wide */
    .ue-legend{justify-content:center}
    /* never an odd number on a line: four across, then two and two */
    .clocks{grid-template-columns:repeat(4,minmax(0,1fr))}
}
  @media (max-width:680px){
    .clocks{grid-template-columns:repeat(2,minmax(0,1fr))}
}
  @media (max-width:520px){
    .hl.has-media{grid-template-columns:minmax(0,1fr) 0;column-gap:0}
    .hl.has-media .hl-media{display:none}
}
</style>

<body>
  <div class="contrail c-top" aria-hidden="true"></div>

  <div class="wrap">
    <!-- LAUNCH CARD — only rendered by ?section=mobile while the widget is
         collapsed. Mindtickle's expand control then acts as the launch button
         and the same document re-renders as the full Command Center. -->
    <div class="launch" id="launch">
      <div class="lc-top">
        <img class="lc-logo" src="assets/images/logos/qlik-sales-enablement.svg" alt="Qlik Sales Enablement"

        Tap to launch
      </div>
    </div>
    <nav class="hotlinks rise d1" aria-label="Quick links">

          <img class="logo logo-light" src="assets/images/logos/Sales_Enablement_Logos/Typemark_Qlik-Sales-Enablement_Color.svg" alt="Qlik Sales Enablement" onerror="brandFallback()">

<script>
function brandFallback(){ var b=document.getElementById('brand'); if(b) b.classList.add('fb'); }
function sfBrandFallback(img){ var p=img.closest('.sf-brand'); if(p) p.classList.add('fb'); }

/* ---- BOOT GATING ---------------------------------------------------------
   Each section is its own document. Without this, all four widgets would poll
   the news + market endpoints and run their own timers four times over. */
const SECTION   = document.documentElement.getAttribute('data-section') || '';
const IS_MOBILE = SECTION === 'mobile';
const SHOW_TOP  = !SECTION || SECTION === 'topbar'     || IS_MOBILE;
const SHOW_TICK = !SECTION || SECTION === 'ticker'     || IS_MOBILE;
const SHOW_HL   = !SECTION || SECTION === 'highlights' || IS_MOBILE;
const SHOW_HUBS = !SECTION || SECTION === 'hubs'       || IS_MOBILE;

/* ---- mobile: card vs full ------------------------------------------------
   Collapsed, Mindtickle gives this iframe roughly 200px. Expanded it gets the
   whole screen. The gap is large enough that viewport height alone tells us
   which state we're in — no bridge to the host app required, which is just as
   well because the widget can't run JS or reach the expand control. */
const MODE_MIN = 420;
function syncMode(){
  if (!IS_MOBILE) return;
  const m = window.innerHeight >= MODE_MIN ? 'full' : 'card';
  if (document.documentElement.getAttribute('data-mode') !== m)
    document.documentElement.setAttribute('data-mode', m);
}
if (IS_MOBILE){
  syncMode();
  window.addEventListener('resize', syncMode);
  if (window.ResizeObserver) new ResizeObserver(syncMode).observe(document.documentElement);
  /* the launch card carries a live clock so the collapsed state isn't static */
  const lcG = document.getElementById('lcGreet'), lcT = document.getElementById('lcTime');
  function lcTick(){
    const d = new Date(), h = d.getHours();
    lcG.textContent = h < 12 ? 'Good morning' : (h < 18 ? 'Good afternoon' : 'Good evening');
    lcT.textContent = d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
  }
  lcTick(); setInterval(lcTick, 30000);
}

/* ---- HIGHLIGHTS — rotating custom posts ----------------------------------
   Hand-edit this array until the manager control app can write it. Each entry:
     kicker  short eyebrow label
     title   supports <span class="ac"> for the green accent word
     body    one or two sentences
     cta     optional { label, href } or an array of them — multiple links
             always render side by side, never stacked
     image   optional URL — shows in the reserved media panel on the right.
             Omit and the panel collapses so the text uses the full width.     */
const HIGHLIGHTS = [
  { kicker:'This Week',
    title:'Accelerate your pipeline with <span class="ac">AI</span>.',
    body:'Find what you need, jump straight in, and let the connected workflow carry the deal forward — everything that helps you win, in one place.' },
  { kicker:'New Release',
    title:'Deal Guides are <span class="ac">live</span>.',
    body:'Every open opportunity now carries a guided next-best-action built from the methodology your team already runs.',
    cta:{ label:'Open Deal Guides', href:'#' } },
  { kicker:'Stellar-Seller',

  const today = new Date(); today.setHours(0,0,0,0);

    d.innerHTML = '<span class="hl-kicker">'+h.kicker+'</span>'
      + '<h1 class="hl-title">'+h.title+'</h1>'
      + '<p class="hl-body">'+h.body+'</p>'
      + (function(){

          return '<span class="hl-ctas">' + list.map(function(c){
            return '<a class="hl-cta" href="'+c.href+'"'
              + (c.href.indexOf('http')===0 ? ' target="_top"' : '')
              + '>'+c.label+' &#8599;</a>';
          }).join('') + '</span>';
        })();
    hlStage.appendChild(d);
    return d;
  });
  const hlBtns = HIGHLIGHTS.map(function(h,i){
    const b = document.createElement('button');
    b.type='button'; b.className = i===0 ? 'on' : '';
    b.setAttribute('aria-label','Highlight '+(i+1));
    b.addEventListener('click', function(){ hlGo(i); hlHold(); });
    hlDots.appendChild(b);
    return b;
  });
  /* Slides are absolutely stacked for the crossfade, so the stage has no
     natural height. Measure the tallest slide and reserve that much, or a long
     slide's CTA overflows the card and lands on the key-date chips. */
  function sizeHlStage(){
    let tall = 0;
    hlNodes.forEach(function(el){
      /* offsetTop/offsetHeight are layout values, so they ignore the
         translateY on inactive slides — getBoundingClientRect() does not.
         scrollHeight alone drops the CTA's bottom margin, hence the max(). */
      let h = el.scrollHeight;
      const last = el.lastElementChild;
      if (last) h = Math.max(h, last.offsetTop + last.offsetHeight);
      tall = Math.max(tall, h);
    });
    if (tall > 0 && tall + 4 > parseFloat(hlStage.style.minHeight || 0))
      hlStage.style.minHeight = (tall + 4) + 'px';
  }
  const hlBox = document.getElementById('hl');
  const hlMedia = document.getElementById('hlMedia');
  let hlI = 0, hlTimer = null;
  function hlGo(n){
    hlI = (n + hlNodes.length) % hlNodes.length;
    hlNodes.forEach(function(el,i){ el.classList.toggle('on', i===hlI); });
    hlBtns.forEach(function(el,i){ el.classList.toggle('on', i===hlI); });
    const img = HIGHLIGHTS[hlI] && HIGHLIGHTS[hlI].image;
    hlBox.classList.toggle('has-media', !!img);
    hlMedia.innerHTML = img ? '<img src="'+img+'" alt="">' : '';
  }
  sizeHlStage();
  hlGo(0);
  /* Re-measure whenever anything actually reflows: fonts arriving late, the
     responsive breakpoints, or a slide's copy changing. The stage only ever
     grows, so this settles rather than oscillating. */
  window.addEventListener('resize', sizeHlStage);
  window.addEventListener('load', sizeHlStage);
  requestAnimationFrame(sizeHlStage);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeHlStage);
  if (window.ResizeObserver){
    const hro = new ResizeObserver(sizeHlStage);
    hlNodes.forEach(function(n){ hro.observe(n); });
  }
  function hlHold(){ clearInterval(hlTimer); hlTimer = setInterval(function(){ hlGo(hlI+1); }, HL_MS); }
  if (hlNodes.length > 1) hlHold(); else hlDots.style.display='none';
}

const ZONES = [   /* EDIT HERE — country, city, IANA timezone */

/* order so the zones furthest ahead — the ones that enter the day first — lead */
function tzOffsetMin(tz){
  const now = new Date();
  const loc = new Date(now.toLocaleString('en-US',{timeZone:tz}));
  const utc = new Date(now.toLocaleString('en-US',{timeZone:'UTC'}));
  return Math.round((loc - utc)/60000);
}
ZONES.sort((a,b)=> tzOffsetMin(b.tz) - tzOffsetMin(a.tz));

function zoneParts(tz){
  const p = new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short'}).formatToParts(new Date());
  const o={}; p.forEach(x=>{ o[x.type]=x.value; }); return o;
}
function zoneTime(tz){
  return new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit',hour12:true,weekday:'short'}).format(new Date());
}
function tickClocks(){
  clockNodes.forEach(n=>{
    const o = zoneParts(n.z.tz);
    const H = parseInt(o.hour,10)%24, M = parseInt(o.minute,10), S = parseInt(o.second,10);
    n.s.setAttribute('transform','rotate('+(S*6)+' 50 50)');
    n.m.setAttribute('transform','rotate('+(M*6 + S*0.1)+' 50 50)');
    n.h.setAttribute('transform','rotate('+((H%12)*30 + M*0.5)+' 50 50)');
    n.t.textContent = zoneTime(n.z.tz);
    const weekend = (o.weekday==='Sat' || o.weekday==='Sun');
    n.el.classList.toggle('closed', weekend || H<9 || H>=18);   /* dark when out of business hours where they are */
  });
}

const GLYPHS = '!<>-_\\/[]{}=+*^?#01';
const QREDUCE = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
let qi = 0, qraf;
function scramble(text, done){
  if(QREDUCE){ qt.textContent = text; if(done) done(); return; }
  const arr = [];
  for(let i=0;i<text.length;i++){
    const start = Math.floor(Math.random()*18);
    const end = start + 14 + Math.floor(Math.random()*18);
    arr.push({c:text[i], start, end, s:''});
  }
  let frame = 0; cancelAnimationFrame(qraf);
  (function run(){
    let out = '', settled = 0;
    for(const it of arr){
      if(frame >= it.end){ settled++; out += it.c; }
      else if(frame >= it.start){
        if(!it.s || Math.random()<0.3) it.s = GLYPHS[Math.floor(Math.random()*GLYPHS.length)];
        out += '<span class="scr">'+it.s+'</span>';
      }
    }
    qt.innerHTML = out;
    if(settled === arr.length){ if(done) done(); }
    else { frame++; qraf = requestAnimationFrame(run); }
  })();
}
const QT_MAX = 15, QT_MIN = 9;   /* px — shrink range before we give up */
function fitQuote(){
  const box = qt.parentElement;                 /* .quote, locked height */
  let size = QT_MAX, guard = 0;
  qt.style.fontSize = size+'px';
  /* Overflow is tested on the locked container, not on qt. qt is a flex item,
     so its own scrollHeight just tracks its height and never reports spill. */
  while (box.scrollHeight > box.clientHeight && size > QT_MIN && guard++ < 40){
    size -= 0.5; qt.style.fontSize = size+'px';
  }
}
function showQuote(){
  qb.style.opacity = 0;
  scramble('\u201C'+QUOTES[qi][0]+'\u201D', ()=>{
    qb.textContent = '\u2014 '+QUOTES[qi][1]; qb.style.opacity = 1; fitQuote();
  });
  fitQuote();
}
showQuote();
if (SHOW_HL) setInterval(()=>{ qi=(qi+1)%QUOTES.length; showQuote(); }, 13000);

/* ---- light / dark toggle (always starts dark) ----------------------------
   The toggle button only exists in the topbar widget, but all four widgets
   are separate documents on the same origin and must stay in step. Three
   independent channels carry the change, because in the Mindtickle embed any
   one of them can be blocked by third-party storage partitioning:
     1. localStorage + the storage event   instant, but partition-dependent
     2. BroadcastChannel                   instant, works without storage
     3. a 1.5s poll of localStorage        slow, but catches anything missed
   Whichever arrives first wins; applyTheme() is idempotent.                */
const SUN_ICON='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>';
const MOON_ICON='<svg viewBox="0 0 24 24"><path d="M20.5 13.5A8 8 0 1110.5 3.5a6.3 6.3 0 0010 10z"/></svg>';
const tBtn = document.getElementById('themeToggle');
const THEME_KEY = 'qlikTheme';
let theme = 'dark';
try { theme = localStorage.getItem(THEME_KEY) || 'dark'; } catch(e){}

let themeChan = null;
try { themeChan = new BroadcastChannel('qlik-theme'); } catch(e){}

function repaintMasked(){
  /* .ticker-win / .mtape-win use mask-image, which Chrome composites. A theme
     change on <html> doesn't always invalidate that layer, so the ticker keeps
     its old colours until a hover forces a repaint. Nudging will-change
     demotes and re-promotes the layer, which does invalidate it. */
  document.querySelectorAll('.ticker-win,.mtape-win').forEach(function(el){
    el.style.willChange='opacity'; void el.offsetHeight; el.style.willChange='';
  });
}
function paintTheme(m){
  if(m==='light') document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  requestAnimationFrame(repaintMasked);
  if(tBtn){
    tBtn.innerHTML = (m==='light') ? MOON_ICON : SUN_ICON;
    tBtn.setAttribute('aria-label', (m==='light') ? 'Switch to dark mode' : 'Switch to light mode');
  }
}
function applyTheme(m){
  m = (m==='light') ? 'light' : 'dark';
  if(m === theme && document.documentElement.hasAttribute('data-theme') === (m==='light')) return;
  theme = m; paintTheme(theme);
}
paintTheme(theme);

if(tBtn) tBtn.addEventListener('click', ()=>{
  const next = (theme==='dark') ? 'light' : 'dark';
  try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  if(themeChan) try { themeChan.postMessage(next); } catch(e){}
  applyTheme(next);
});

window.addEventListener('storage', (e)=>{ if(e.key===THEME_KEY) applyTheme(e.newValue); });
if(themeChan) themeChan.onmessage = (e)=>{ applyTheme(e.data); };
setInterval(()=>{
  let stored = null;
  try { stored = localStorage.getItem(THEME_KEY); } catch(e){ return; }
  if(stored) applyTheme(stored);
}, 1500);

/* keep the NEWS + MARKETS tabs the same width so their shapes line up */
function alignTabs(){
  const a=document.querySelector('.qnews'), b=document.querySelector('.mk-bug');
  if(!a||!b||!a.offsetParent) return;
  a.style.width=b.style.width='';
  const w=Math.ceil(Math.max(a.offsetWidth,b.offsetWidth));
  a.style.width=b.style.width=w+'px';
}
alignTabs();
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(alignTabs); }
window.addEventListener('resize', alignTabs);

/* ---- market pulse (live via the Vercel proxy) ---- */
const MARKET_ENDPOINT = '/api/command/market';   /* same-origin on Vercel — no domain to hardcode */
const SAMPLE = [   /* placeholder shown until the live endpoint answers — no LIVE badge until it does */
  {t:'SPY', label:'S&P 500',    price:5894.20, pct:0.42},
  {t:'QQQ', label:'Nasdaq 100', price:21340.70, pct:0.61},
  {t:'MSFT',label:'Microsoft',  price:478.90,  pct:-0.18},
  {t:'CRM', label:'Salesforce', price:312.40,  pct:0.27},
  {t:'SNOW',label:'Snowflake',  price:198.60,  pct:1.12},
  {t:'PLTR',label:'Palantir',   price:142.30,  pct:-0.54},
  {t:'NVDA',label:'Nvidia',     price:875.30,  pct:0.88},
  {t:'ORCL',label:'Oracle',     price:178.40,  pct:0.33},
];
const chips = document.getElementById('chips'), liveDot = document.getElementById('liveDot');
function renderChips(list, live){
  const html = list.map(q=>{
    const up = (q.pct||0) >= 0;
    const arrow = up ? '\u25B2' : '\u25BC';
    const pct = (q.pct==null) ? '' : (up?'+':'') + Number(q.pct).toFixed(2) + '%';
    const price = (q.price==null) ? '\u2014'
      : Number(q.price).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
    const sym = (q.symbol || q.t || '').toString();
    const ico = q.logo
      ? '<span class="c-ico"><img src="'+q.logo+'" alt="" onerror="this.parentNode.textContent=\''+sym+'\'"></span>'
      : '<span class="c-ico">'+sym+'</span>';
    return '<span class="chip">'+ico
      + '<span class="c-sym">'+sym+'</span>'
      + '<span class="c-p">'+price+'</span>'
      + '<span class="c-d '+(up?'up':'down')+'">'+arrow+' '+pct+'</span></span>';
  }).join('');
  chips.innerHTML = html + html;   /* duplicate for a seamless loop */
  if(liveDot) liveDot.classList.toggle('on', !!live);
}
renderChips(SAMPLE, false);
if (SHOW_TICK) fetch(MARKET_ENDPOINT)
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => { if(d && d.quotes && d.quotes.length) renderChips(d.quotes, true); })
  .catch(()=>{ /* endpoint not live yet — keep sample, leave LIVE off */ });

/* ---- news ticker (merged GNews + MarketAux via /api/news) ---- */
const NEWS_ENDPOINT = '/api/command/news';
const SAMPLE_NEWS = [   /* placeholder until the live endpoint answers */
  {title:'Qlik expands Open Lakehouse with real-time streaming ingestion', source:'Qlik', url:'#'},
  {title:'Enterprises double down on trusted data for AI initiatives', source:'Industry', url:'#'},
  {title:'Analytics buyers prioritize governance and data quality in 2026', source:'Market', url:'#'},
  {title:'Competitive shifts among cloud data platforms continue', source:'Markets', url:'#'},
  {title:'AI copilots reshape how sellers prep for customer calls', source:'Trends', url:'#'},
];
const newsTrack = document.getElementById('newsTrack');
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function faviconFor(url){ try { return 'https://www.google.com/s2/favicons?domain=' + new URL(url).hostname + '&sz=64'; } catch(e){ return ''; } }
function renderNews(list){
  const html = list.map(n => {
    const fav = faviconFor(n.url);
    const img = fav ? '<img class="ticker-fav" src="'+fav+'" alt="" onerror="this.style.display=\'none\'">' : '';
    const tgt = (n.url && n.url.indexOf('http')===0) ? ' target="_blank" rel="noopener noreferrer"' : '';
    return '<a class="ticker-item" href="'+esc(n.url)+'"'+tgt+'>'+img
      + '<span class="ti-title">'+esc(n.title)+'</span> <span class="ti-src">'+esc(n.source)+'</span></a>';
  }).join('');
  newsTrack.innerHTML = html + html;   /* duplicate for a seamless loop */
}
renderNews(SAMPLE_NEWS);
if (SHOW_TICK) fetch(NEWS_ENDPOINT)
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => { if(d && d.items && d.items.length) renderNews(d.items); })
  .catch(()=>{ /* endpoint not live yet — keep sample headlines */ });

/* ---- tell the Mindtickle parent our height so the iframe can auto-fit (no internal scroll) ---- */
function postHeight(){
  try { parent.postMessage({ qlikmtHeight: document.documentElement.scrollHeight }, '*'); } catch(e){}
}
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);

/* ---- faint brand contrail, drawn right-to-left, behind the glass ---- */
const CONTRAIL = '<svg viewBox="0 0 600 240">'
  + '<path pathLength="1" d="M600 40 C 420 74, 220 34, 10 60" stroke="#10CFC9" stroke-width="2.4"/>'
  + '<path pathLength="1" d="M600 76 C 440 106, 240 70, 30 96" stroke="#00A651" stroke-width="2"/>'
  + '<path pathLength="1" d="M600 120 C 470 146, 290 112, 80 134" stroke="#10CFC9" stroke-width="1.4" opacity=".75"/>'
  + '<path pathLength="1" d="M600 160 C 500 182, 320 158, 140 176" stroke="#1d9e75" stroke-width="1.1" opacity=".6"/>'
  + '</svg>';
const contrails = document.querySelectorAll('.contrail');
contrails.forEach(c => { c.innerHTML = CONTRAIL; });
if ('IntersectionObserver' in window){
  const io = new IntersectionObserver((ents)=>{
    ents.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('draw'); io.unobserve(e.target); } });
  }, { threshold:0.25 });
  contrails.forEach(c => io.observe(c));
} else {
  contrails.forEach(c => c.classList.add('draw'));
}
</script>
