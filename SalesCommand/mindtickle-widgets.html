<!--
  ===========================================================================
  MINDTICKLE EMBED CODE  ·  Qlik 2026 Sales Command
  ===========================================================================
  Page layout : 1 COLUMN
  Rows        : four rows, one Custom HTML and CSS widget each, in this order

      ROW 1   topbar       theme toggle + beta strip, quick links beneath
      ROW 2   ticker       Current News crawl + Markets ribbon
      ROW 3   highlights   logo/title + highlights rotator | greeting stack
      ROW 4   hubs         hub tabs + tiles

  Paste each block into that widget's HTML tab. Leave the CSS tab empty --
  Mindtickle scopes it, so it cannot reach anything outside the widget.
  Set each widget height to Fixed.

  The <style> block sits inside the HTML tab on purpose. Mindtickle's docs
  allow CSS there, and that keeps the rule in the same scope as the iframe
  it targets, which is what lets the frames grow on a phone without JS.

  Theme: the toggle lives only in ROW 1. It writes localStorage, and the
  other three widgets read it on load and listen for the storage event, so
  one click flips all four. Verified across documents.
  ===========================================================================
-->


<!-- ============================ ROW 1 - TOPBAR ========================== -->

<style>
  .qlik-sc-topbar{ width:100%; height:130px; border:0; display:block; }
  @media (max-width:430px){ .qlik-sc-topbar{ height:190px; } }
</style>

<iframe class="qlik-sc-topbar"
  src="https://qlik-gse.vercel.app/SalesCommand/qlikmt-hero.html?section=topbar"
  title="Announcements and quick links"
  loading="lazy" scrolling="no"></iframe>


<!-- ============================ ROW 2 - TICKER ========================== -->

<style>
  .qlik-sc-ticker{ width:100%; height:115px; border:0; display:block; }
</style>

<iframe class="qlik-sc-ticker"
  src="https://qlik-gse.vercel.app/SalesCommand/qlikmt-hero.html?section=ticker"
  title="Industry news and market pulse"
  loading="lazy" scrolling="no"></iframe>


<!-- ========================== ROW 3 - HIGHLIGHTS ======================== -->

<style>
  .qlik-sc-highlights{ width:100%; height:390px; border:0; display:block; }
  /* below 960px the greeting stack drops under the rotator */
  @media (max-width:960px){ .qlik-sc-highlights{ height:530px; } }
  @media (max-width:430px){ .qlik-sc-highlights{ height:560px; } }
</style>

<iframe class="qlik-sc-highlights"
  src="https://qlik-gse.vercel.app/SalesCommand/qlikmt-hero.html?section=highlights"
  title="Highlights, time and world clocks"
  loading="lazy" scrolling="no"></iframe>


<!-- ============================= ROW 4 - HUBS =========================== -->

<style>
  .qlik-sc-hubs{ width:100%; height:285px; border:0; display:block; }
  /* tiles go 2-up, then 1-up */
  @media (max-width:880px){ .qlik-sc-hubs{ height:400px; } }
  @media (max-width:560px){ .qlik-sc-hubs{ height:620px; } }
</style>

<iframe class="qlik-sc-hubs"
  src="https://qlik-gse.vercel.app/SalesCommand/qlikmt-hero.html?section=hubs"
  title="Content hubs"
  loading="lazy" scrolling="no"></iframe>
