<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widget size probe</title>
<!-- ===========================================================================
  THROWAWAY DIAGNOSTIC — delete once the mobile questions are answered.
  Reports the size the iframe is actually given, live. Read the big number
  collapsed, then tap Mindtickle's expand icon and read it again.
  =========================================================================== -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  /* Everything jammed into the TOP-LEFT corner. Whatever the crop turns out
     to be, that corner is the one region guaranteed to survive it. */
  body{background:#11304D;color:#EDF3F9;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;
    text-align:left;padding:4px 8px 8px 8px;gap:2px;position:relative}

  /* a ruler down the side: if the whole strip is visible the iframe really is
     as tall as it claims; if it is cut off, the height is being faked */
  .ruler{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
  .band{position:absolute;left:0;right:0;height:10px;display:flex;align-items:center;
    font-size:8px;font-weight:700;letter-spacing:.06em;padding-left:5px;color:#0B1F33}
  .band.a{background:#10CFC9}
  .band.b{background:#7FE3E0}
  .band.big{background:#FF6B6B;color:#fff}

  .num{font-size:clamp(28px,8vw,46px);font-weight:800;line-height:1;letter-spacing:-.02em}
  .num span{color:#10CFC9}
  .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8FA6BC}
  .note{font-size:11px;color:#B9CBDD;max-width:34ch;line-height:1.35}
  .foot{position:absolute;left:8px;right:6px;bottom:7px;
    font-size:10px;color:#6E869E;display:flex;justify-content:space-between;gap:8px}
  .bot{position:absolute;left:0;right:0;bottom:0;height:5px;background:#00A651}
</style>
</head>
<body>
  <div class="ruler" id="ruler"></div>

  <div class="lbl">iframe viewport</div>
  <div class="num" id="size">–</div>
  <div class="note" id="note">Read this number, then tap the expand icon and read it again.</div>

  <div class="foot"><span id="dpr"></span><span id="mode"></span></div>
  <div class="bot"></div>

<script>
  var sizeEl = document.getElementById('size');
  var noteEl = document.getElementById('note');
  var modeEl = document.getElementById('mode');
  var rulerEl = document.getElementById('ruler');
  var seenMax = 0;

  function tick(){
    var w = Math.round(window.innerWidth);
    var h = Math.round(window.innerHeight);
    sizeEl.innerHTML = w + ' <span>&times;</span> ' + h;

    if (h > seenMax) seenMax = h;
    modeEl.textContent = 'tallest seen: ' + seenMax + 'px';
    noteEl.textContent = (h > 400)
      ? 'EXPANDED — the iframe really was given more height.'
      : 'COLLAPSED — this is the cap.';

    /* Labelled 10px bands through the crop zone. Read the LAST number you can
       see on the phone — that is the visible window height. */
    rulerEl.innerHTML = '';
    for (var y = 100; y < Math.min(h, 320); y += 10){
      var d = document.createElement('div');
      d.className = 'band ' + (y % 50 === 0 ? 'big' : (y % 20 === 0 ? 'a' : 'b'));
      d.style.top = y + 'px';
      d.textContent = y;
      rulerEl.appendChild(d);
    }
  }

  document.getElementById('dpr').textContent = 'dpr ' + (window.devicePixelRatio || 1);
  tick();
  window.addEventListener('resize', tick);
  if (window.ResizeObserver) new ResizeObserver(tick).observe(document.documentElement);
  setInterval(tick, 500);
</script>
</body>
</html>
