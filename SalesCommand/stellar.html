<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stellar-Seller Universe</title>
<script>
  /* Section AND theme before styles, same as the other widget pages, so the
     first paint is already correct and nothing flashes. */
  (function(){
    document.documentElement.classList.add('js');
    var q = new URLSearchParams(location.search);
    var s = q.get('section'); if (s) document.documentElement.setAttribute('data-section', s);
    var t = q.get('theme');   if (t === 'light') document.documentElement.setAttribute('data-theme','light');
    // Explicit compact mode. Width cannot be trusted to detect the phone:
    // Android reports ~1080 CSS px for the same widget iframe that iOS reports
    // ~408 for, so a max-width rule fires on one and not the other. The mobile
    // widget asks for compact by name.
    // Compact IS the mobile app (both the Systems Watch banner and the
    // hero rotator widgets ask for it) — and the mobile app is white
    // chrome, so compact always renders the light theme. Per Travis.
    if (q.get('compact') === '1') {
      document.documentElement.setAttribute('data-compact','1');
      document.documentElement.setAttribute('data-theme','light');
    }
  })();
</script>

<!-- ============================================================================
  SalesCommand/stellar.html — Stellar-Seller Universe widgets.

  FRAME CONTRACT — this is why the numbers here look arbitrary and are not.
  Every Mission Control widget is a separate iframe that Mindtickle sizes
  independently, so nothing can rely on a shared container. They line up
  because they all use the SAME fixed inset:

      --secpad-x: 36px   (20px under 640px)
      .wrap padding: clamp(14px,1.6vw,20px) var(--secpad-x)

  Fixed px, never vw, or two widgets of different widths land their content on
  different lines. Palette, card treatment and light-theme handling are copied
  from qlikmt-hero.html for the same reason — these sit inches apart on one
  page and any drift reads as a mistake.

  SECTIONS
    ?section=banner   Stellar-Seller wordmark, centred, with Systems Watch
                      centred beneath it
    ?section=hero     rotating post in the same card treatment as the homepage
                      rotator, but WITHOUT the wordmark and fed from
                      STELLAR_POSTS in this file

  Both are built to fit Mindtickle's ~200px mobile crop, because its expand
  control does not grow the iframe — anything below 200px is never seen.
  ============================================================================ -->

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* boot veil: the widget assembles off-stage and arrives in one piece —
   fonts, feeds and entrance motion settle behind it. html.js guard: if
   scripting ever fails, the page simply shows unveiled. */
html.js body{opacity:0}
html.js body.booted{opacity:1;transition:opacity .45s ease}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

/* Palette lifted from qlikmt-hero.html so the two pages cannot drift apart. */
:root{
  --navy-0:#0B1F33; --navy-1:#11304D; --navy-2:#19426C;
  --green:#00A651; --sky:#10CFC9;
  --violet:#9B59FF;
  --ink:#EDF3F9; --muted:#90A6BD;
  --line:rgba(255,255,255,.10);
  --ok:#00C46A; --warn:#FFB020; --bad:#FF3B4E;
}
[data-theme="light"]{
  --ink:#0E2742; --muted:#5b7088; --line:rgba(15,40,70,.14);
  --sky:#0E8A84; --green:#00904A;
}

html,body{height:100%}
body{
  background:var(--navy-1); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  /* Mindtickle applies word-break to widget content; put it back. */
  word-break:normal; overflow-wrap:normal;
  -webkit-text-size-adjust:100%;
}
/* The rotator is the seam between Mission Control and the REC Room: it sits
   under the Mission Control widgets and above the REC Room ones. So it fades
   from Mission Control navy (#11304D, the exact surface its neighbours are
   painted on) into the REC Room night sky (#10172A, the exact surface the
   REC Room widgets use) — the two ends match their neighbours precisely, so
   the join is invisible and the section reads as one descent rather than
   three separate boxes. */
html[data-section="hero"] body{
  background:linear-gradient(180deg,#11304D 0%,#16294A 45%,#10172A 100%);
}
/* Light mode has no night sky to descend into, so it stays flat. */
[data-theme="light"] body{background:#eef3f9}
html[data-section="hero"][data-theme="light"] body{background:#eef3f9}
@media (max-width:500px){ [data-theme="light"] body{background:#fff} }
img{max-width:100%;display:block}

/* Embedded widgets: no scroll chrome, no viewport floor. */
html[data-section],html[data-section] body{min-height:0}
html[data-section]{scrollbar-width:none;-ms-overflow-style:none}
html[data-section]::-webkit-scrollbar,
html[data-section] body::-webkit-scrollbar{width:0;height:0;display:none}
/* A widget has a height handed to it and nowhere to put a scrollbar, so it must
   not scroll at all. This is a backstop, not the fix — the stage below is sized
   to its content at runtime so there should be nothing to clip. */
html[data-section],html[data-section] body{overflow:hidden}

/* THE alignment knob. Fixed px so every widget lands on the same line. */
html[data-section]{--secpad-x:36px}
@media (max-width:640px){ html[data-section]{--secpad-x:20px} }
.wrap{margin:0;max-width:none;padding:clamp(14px,1.6vw,20px) var(--secpad-x)}

/* Fill the widget rather than sizing to the content, exactly as the section
   cards do. A widget is handed a fixed height; content that sizes itself
   either overflows it or floats short inside it, and both look wrong beside
   neighbours that fill. Filling means ONE height works for every widget in
   the set and the copy can change freely. */
html[data-section],html[data-section] body{height:100%}
html[data-section] .wrap{
  height:100%;display:flex;flex-direction:column;justify-content:center;
}
/* The banner was cramped along its bottom edge — the chips sat right on it.
   Give that edge its own breathing room without changing the shared inset. */
html[data-section="banner"] .wrap{padding-bottom:clamp(22px,2.6vw,34px)}

/* Hide every top-level block; per-section rules re-show what that view owns,
   at matching specificity and ordered after. */
html[data-section] .wrap > *{display:none}

/* ============ BANNER — wordmark centred, Systems Watch beneath ============ */
.ssb{text-align:center}
/* Sized to lead the widget. The art measures 900x400 with SOLID ink only
   between 24% and 75.5% of its height — the bottom quarter is transparent
   falloff. That band is why the Systems Watch can ride up underneath it
   without ever touching the wordmark. */
.ssb-mark{margin:0 auto;width:clamp(240px,42vw,520px)}
.ssb-mark img{width:100%;height:auto;filter:drop-shadow(0 0 26px rgba(155,89,255,.30))}
[data-theme="light"] .ssb-mark img{filter:none}

/* Negative, on purpose: the watch tucks up into the artwork's transparent
   lower band so the two read as one lockup instead of two stacked blocks.
   It only ever overlaps falloff, never the letterforms. */
.ssb-watch{margin-top:clamp(-46px,-2.8vw,-16px);position:relative;z-index:1}
.ssb-kicker{
  font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:var(--sky);display:inline-flex;align-items:center;gap:7px;margin-bottom:9px;
}
.ssb-kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sky)}

/* Centred row that wraps evenly rather than left-packing on the last line. */
.svc{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.svc-item{
  display:inline-flex;align-items:center;gap:8px;padding:8px 13px;min-width:0;
  border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
[data-theme="light"] .svc-item{background:rgba(255,255,255,.42);border-color:rgba(15,40,70,.12)}
.svc-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--muted)}
.svc-item.ok   .svc-dot{background:var(--ok);  box-shadow:0 0 10px var(--ok)}
.svc-item.warn .svc-dot{background:var(--warn);box-shadow:0 0 10px var(--warn);animation:pulseDot 1.4s ease-in-out infinite}
.svc-item.down .svc-dot{background:var(--bad); box-shadow:0 0 12px var(--bad); animation:pulseDot .7s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.svc-item .svc-dot{animation:none}}
.svc-name{font-size:13px;font-weight:600;white-space:nowrap}
.svc-state{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.svc-item.ok   .svc-state{color:var(--ok)}
.svc-item.warn .svc-state{color:var(--warn)}
.svc-item.down .svc-state{color:var(--bad)}
.svc-item.unk  .svc-state{color:var(--muted)}

/* ========== HERO — the homepage rotator's card, minus the wordmark ========== */
.ssh{
  position:relative;min-width:0;
  border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);padding:clamp(12px,1.6vw,18px);
}
[data-theme="light"] .ssh{background:rgba(255,255,255,.42);border-color:rgba(15,40,70,.12)}
.ssh-stage{position:relative;min-height:clamp(118px,12vw,164px)}
.ssh-item{
  position:absolute;left:0;right:0;top:0;opacity:0;transform:translateY(8px);
  transition:opacity .5s ease, transform .5s ease;pointer-events:none;
}
.ssh-item.on{opacity:1;transform:none;pointer-events:auto}
.ssh-kicker{
  font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:var(--sky);display:inline-flex;align-items:center;gap:7px;
}
.ssh-kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sky);flex:0 0 auto}
/* Capped at two lines, and the body at two, because the widget height is a
   fixed constant in Mindtickle while the copy in STELLAR_POSTS is not. Without
   a cap, a longer headline silently outgrows the widget and gets clipped —
   editing a post would break the layout with no warning. This makes the tallest
   possible post a known quantity, which is what the height below is measured
   against. */
.ssh-title{
  font-weight:600;line-height:1.04;font-size:clamp(30px,4.2vw,50px);
  letter-spacing:-.01em;margin:.22em 0 .3em;text-wrap:balance;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.ssh-title .ac{color:var(--green)}
.ssh-body{font-size:clamp(14px,1.4vw,16px);line-height:1.55;color:#bccfe2;max-width:560px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
[data-theme="light"] .ssh-body{color:#42566c}
.ssh-dots{display:flex;gap:7px;margin-top:14px}
.ssh-dots button{
  width:8px;height:8px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:rgba(255,255,255,.22);transition:background .2s,transform .2s;
}
@media (hover:hover){ .ssh-dots button:hover{background:var(--muted)} }
.ssh-dots button.on{background:var(--sky);transform:scale(1.25)}

/* ========================= SECTION VISIBILITY ========================== */
html[data-section="banner"] .wrap > .banner{display:block}
html[data-section="hero"]   .wrap > .hero{display:block}

/* ============================ THE 200px BOX ============================
   Mindtickle's app crops every widget to ~200px and its expand control does
   NOT grow the iframe, so on a phone that is the entire budget.

   TWO TRIGGERS, and the first is the one that matters:

     html[data-compact="1"]   set by ?compact=1 — what the MOBILE widget uses
     @media (max-width:700px) a genuinely narrow page

   Width alone cannot be trusted here. Android reports ~1080 CSS px for the
   same widget iframe that iOS reports ~408 for, so a width rule fires on one
   phone and not the other. The mobile widget therefore asks for compact BY
   NAME and does not rely on being measured. The media query stays as a
   courtesy for anyone opening the page directly in a narrow browser.

   Everything below is the same declaration list emitted twice, because CSS
   cannot OR a selector with a media query. */
html[data-compact="1"] .ssb-mark{width:min(230px,74%)}
html[data-compact="1"] .ssb-watch{margin-top:9px}
html[data-compact="1"] .ssb-kicker{display:none}
html[data-compact="1"] .svc{display:grid;grid-template-columns:1fr 1fr;gap:6px}
html[data-compact="1"] .svc-item{padding:6px 9px;gap:6px;border-radius:11px;justify-content:center}
html[data-compact="1"] .svc-name{font-size:11.5px}
html[data-compact="1"] .svc-state{font-size:9.5px;letter-spacing:.08em}
html[data-compact="1"] .ssh{padding:12px}
html[data-compact="1"] .ssh-stage{min-height:96px}
html[data-compact="1"] .ssh-title{font-size:21px;margin:.18em 0 .24em}
html[data-compact="1"] .ssh-body{font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html[data-compact="1"] .ssh-dots{margin-top:10px}

@media (max-width:700px){
  .ssb-mark{width:min(230px,74%)}
  .ssb-watch{margin-top:9px}
  .ssb-kicker{display:none}
  .svc{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .svc-item{padding:6px 9px;gap:6px;border-radius:11px;justify-content:center}
  .svc-name{font-size:11.5px}
  .svc-state{font-size:9.5px;letter-spacing:.08em}
  .ssh{padding:12px}
  .ssh-stage{min-height:96px}
  .ssh-title{font-size:21px;margin:.18em 0 .24em}
  .ssh-body{font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ssh-dots{margin-top:10px}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============================= BANNER ============================= -->
  <div class="banner">
    <div class="ssb">
      <div class="ssb-mark">
        <img src="assets/images/stellar/stellar-seller-banner.webp"
             alt="Stellar-Seller and the Side-Qlik">
      </div>
      <div class="ssb-watch">
        <span class="ssb-kicker">Systems Watch</span>
        <div class="svc" id="svc" aria-live="polite">
          <!-- Placeholders hold the box open so it does not jump when the first
               fetch lands. Replaced wholesale by paintServices(). -->
          <div class="svc-item unk"><span class="svc-dot"></span><span class="svc-name">Claude</span><span class="svc-state">&middot;&middot;&middot;</span></div>
          <div class="svc-item unk"><span class="svc-dot"></span><span class="svc-name">ChatGPT</span><span class="svc-state">&middot;&middot;&middot;</span></div>
          <div class="svc-item unk"><span class="svc-dot"></span><span class="svc-name">Gemini</span><span class="svc-state">&middot;&middot;&middot;</span></div>
          <div class="svc-item unk"><span class="svc-dot"></span><span class="svc-name">Mindtickle</span><span class="svc-state">&middot;&middot;&middot;</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================== HERO ============================== -->
  <div class="hero">
    <div class="ssh">
      <div class="ssh-stage" id="sshStage"></div>
      <div class="ssh-dots"  id="sshDots"></div>
    </div>
  </div>

</div>

<script>
(function () {
'use strict';

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

/* ======================================================================
   SYSTEMS WATCH

   /api/status covers Claude, ChatGPT, Gemini and Mindtickle and caches for
   five minutes server-side, so polling here is cheap.

     operational / none          -> ONLINE
     minor / degraded / partial  -> POTENTIAL DORC ACTIVITY
     major / critical / outage   -> DORC ATTACK
     unreachable                 -> NO SIGNAL

   NO SIGNAL is deliberately its own state. Not being able to SEE a service is
   not the same as knowing it is down, and shouting DORC ATTACK because our own
   fetch failed would burn the alert the first time someone checked and found
   it fine.
   ====================================================================== */
var SERVICES = ['Claude', 'ChatGPT', 'Gemini', 'Mindtickle'];

function classify(raw) {
  var s = (raw || '').toString().trim().toLowerCase();
  if (s === 'operational' || s === 'none') return { cls:'ok',   label:'Online' };
  if (s === 'minor' || s === 'degraded' || s === 'partial')
                                           return { cls:'warn', label:'Potential DORC Activity' };
  if (s === 'major' || s === 'critical' || s === 'down' || s === 'outage')
                                           return { cls:'down', label:'DORC Attack' };
  return { cls:'unk', label:'No Signal' };
}

function paintServices(list) {
  var host = document.getElementById('svc');
  if (!host) return;
  var by = {};
  (list || []).forEach(function (s) { if (s && s.name) by[s.name] = s; });
  host.innerHTML = SERVICES.map(function (name) {
    var rec = by[name];
    var st  = rec ? classify(rec.status) : { cls:'unk', label:'No Signal' };
    return '<div class="svc-item ' + st.cls + '" title="' +
             esc((rec && rec.description) || st.label) + '">' +
             '<span class="svc-dot"></span>' +
             '<span class="svc-name">'  + esc(name)     + '</span>' +
             '<span class="svc-state">' + esc(st.label) + '</span>' +
           '</div>';
  }).join('');
}

function loadStatus() {
  fetch('/api/status', { cache:'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (Array.isArray(d)) paintServices(d); })
    .catch(function () { /* leave the placeholders — No Signal is honest */ });
}

/* ======================================================================
   HERO ROTATION

   Its own source on purpose. The homepage rotator reads HIGHLIGHTS in
   qlikmt-hero.html; this reads STELLAR_POSTS here, so either strip can be
   changed without touching the other. To add a post, add an object.

   No wordmark in this view — the banner widget above it already carries it,
   and repeating it inside a 200px crop would cost the words their room.
   ====================================================================== */
var STELLAR_POSTS = [
  { kicker:'The Universe',
    title:'Stellar-Seller <span class="ac">and the Side-Qlik</span>.',
    body:'Everything AI-knowledge in one place — the comic, the AI Academy, and the REC Room. Start anywhere.' },
  { kicker:'Now Playing',
    title:'Side-Qlik <span class="ac">Blitz</span>.',
    body:'Clear the board, answer under pressure, and put your territory on the map. Live in the REC Room.' },
  { kicker:'AI Academy',
    title:'Learn the <span class="ac">tools</span>.',
    body:'Practical AI for sellers — what to use, when to use it, and the prompts that actually move a deal.' }
];

var ROTATE_MS = 9000, idx = 0, timer = null, items = [];

function buildHero() {
  var stage = document.getElementById('sshStage');
  var dots  = document.getElementById('sshDots');
  if (!stage || !dots) return;

  stage.innerHTML = STELLAR_POSTS.map(function (p, i) {
    return '<div class="ssh-item' + (i === 0 ? ' on' : '') + '">' +
             '<span class="ssh-kicker">' + esc(p.kicker) + '</span>' +
             '<h1 class="ssh-title">' + p.title + '</h1>' +
             '<div class="ssh-body">' + esc(p.body) + '</div>' +
           '</div>';
  }).join('');
  items = [].slice.call(stage.querySelectorAll('.ssh-item'));

  dots.innerHTML = STELLAR_POSTS.map(function (_, i) {
    return '<button type="button" class="' + (i === 0 ? 'on' : '') +
           '" aria-label="Post ' + (i + 1) + '"></button>';
  }).join('');
  [].slice.call(dots.querySelectorAll('button')).forEach(function (b, i) {
    b.addEventListener('click', function () { show(i); restart(); });
  });
}

/* .ssh-item is position:absolute so it cannot push .ssh-stage taller — a
   two-line title simply overflowed and spilled out of the widget, which is
   what cut it off and made the page scroll. Measure the tallest item and give
   the stage that height, so the card always fits whatever the posts say.
   Re-run on resize because every size in here is vw-based, and after fonts
   load because metrics move when Inter arrives. */
function sizeStage() {
  var stage = document.getElementById('sshStage');
  if (!stage || !items.length) return;
  stage.style.height = 'auto';
  var tallest = 0;
  items.forEach(function (el) { tallest = Math.max(tallest, el.offsetHeight); });
  if (tallest) stage.style.height = tallest + 'px';
}

function show(i) {
  if (!items.length) return;
  idx = (i + items.length) % items.length;
  items.forEach(function (el, n) { el.classList.toggle('on', n === idx); });
  var dots = document.getElementById('sshDots');
  [].slice.call(dots.querySelectorAll('button')).forEach(function (b, n) {
    b.classList.toggle('on', n === idx);
  });
}
function restart() { clearInterval(timer); timer = setInterval(function () { show(idx + 1); }, ROTATE_MS); }

/* ======================================================================
   BOOT — only the section on screen does any work, so four widgets on one
   page do not each poll the status API or run a timer.
   ====================================================================== */
var SECTION = new URLSearchParams(location.search).get('section') || '';

if (SECTION === 'banner' || SECTION === '') {
  loadStatus();
  setInterval(loadStatus, 6 * 60 * 1000);      // server cache is 5 min
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) loadStatus();
  });
}

if (SECTION === 'hero' || SECTION === '') {
  buildHero();
  sizeStage();
  restart();

  /* Live feed — Control Room content. Replaces STELLAR_POSTS wholesale (the
     calendar's KEY_DATES contract): a successful non-empty fetch rebuilds the
     rotator; anything else leaves the hardcoded fallback on stage. buildHero
     is already a from-scratch rebuild, so it only needs re-invoking, plus a
     height reset because the new copy may be shorter than the old. */
  fetch('/api/command/banners?board=stellar', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d || !Array.isArray(d.posts) || !d.posts.length) return;
      STELLAR_POSTS = d.posts;
      idx = 0;
      buildHero();
      sizeStage();
      restart();
    })
    .catch(function () { /* fallback posts already on stage */ });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeStage).catch(function(){});
  var rt;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(sizeStage, 120); });
  // A rotator ticking in a hidden tab is wasted work, and lands the reader on
  // a random post when they come back.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { clearInterval(timer); timer = null; }
    else if (!timer) restart();
  });
}

})();
</script>
<script>
/* lift the boot veil once fonts settle — bounded so it can never hang */
(function(){
  var done=false;
  function up(){ if(done) return; done=true; document.body.classList.add('booted'); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(up);
  window.addEventListener('load', function(){ setTimeout(up, 60); });
  setTimeout(up, 1100);
})();
</script>
</body>
</html>
