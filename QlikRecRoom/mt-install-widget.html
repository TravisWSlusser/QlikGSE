<!--
  Mindtickle Custom HTML snippet: the mobile Mission Control installer
  card ("Install the Mobile REC Room"). NOT served from this repo — this
  markup is pasted directly into Mindtickle admin's Custom HTML widget,
  which is why no deploy here ever changes it. Versioned so the next
  edit does not start from a screenshot (2 Sep 2026).

  Styled to match the Mission Control widget family (stellar.html light
  theme): white card, 14px radius, rgba(15,40,70,.14) hairline, the
  dot-kicker in #0E8A84, ink #0E2742, muted #5b7088. The cyan button is
  the room's identity and stays.

  REPLACE_WITH_KEY below is the Mindtickle session key (?k=...) — the
  live paste carries the real value, which stays out of this public repo.
-->
<div style="font-family:'Inter',system-ui,-apple-system,sans-serif;
            background:#ffffff;padding:14px;word-break:normal">
  <div style="border:1px solid rgba(15,40,70,.14);border-radius:14px;
              background:#ffffff;padding:18px 18px 16px;text-align:left">

    <div style="font-size:12px;font-weight:500;letter-spacing:.2em;
                text-transform:uppercase;color:#0E8A84;margin-bottom:12px">
      <span style="display:inline-block;width:6px;height:6px;border-radius:50%;
                   background:#0E8A84;vertical-align:2px;margin-right:7px"></span>The REC Room
    </div>

    <a href="https://qlik-gse.vercel.app/QlikRecRoom/mobile.html?k=REPLACE_WITH_KEY"
       target="_blank" rel="noopener"
       style="display:block;padding:14px 16px;border-radius:12px;text-align:center;
              background:linear-gradient(180deg,#13E0DA 0%,#10CFC9 100%);
              color:#04121a;font-size:15px;font-weight:700;letter-spacing:.02em;
              text-decoration:none;box-shadow:0 6px 18px rgba(16,207,201,.28)">
      Install the Mobile REC Room
    </a>

    <div style="margin-top:11px;font-size:12px;line-height:1.45;color:#5b7088">
      Every game, on your phone &middot; about 30 seconds
    </div>
  </div>
</div>
