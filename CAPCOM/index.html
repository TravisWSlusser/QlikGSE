<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAPCOM — Qlik Sales Enablement</title>
<meta name="robots" content="noindex">
<!-- Theme before first paint, or light-mode users get a navy flash -->
<script>
try{ document.documentElement.dataset.theme = localStorage.getItem('capcom.theme') || 'dark'; }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%9B%3C/text%3E%3C/svg%3E">
</head>
<body>

<!-- ── key gate ─────────────────────────────────────────────────────── -->
<div id="gate" style="display:none">
  <div class="gate-card">
    <img class="gate-contrail" src="assets/contrail.png" alt="">
    <div class="gate-tm">
      <img class="tm tm-dark" src="assets/typemark-white.svg" alt="Qlik Sales Enablement">
      <img class="tm tm-light" src="assets/typemark-color.svg" alt="Qlik Sales Enablement">
    </div>
    <div class="gate-mark">CAPCOM</div>
    <p class="gate-sub">Mission Control &amp; REC Room administration</p>
    <input id="gate-key" type="password" placeholder="Paste your access key" autocomplete="off" spellcheck="false">
    <button id="gate-go" class="btn accent">Enter</button>
    <p id="gate-err" class="gate-err" style="display:none"></p>
    <p class="gate-note">Keys are scoped — you will only see the areas yours opens.
    Don't have one? Ask Travis.</p>
  </div>
</div>

<!-- ── app shell ────────────────────────────────────────────────────── -->
<div id="shell" style="display:none">
  <aside class="side">
    <div class="side-tm">
      <img class="tm tm-dark" src="assets/typemark-white.svg" alt="Qlik Sales Enablement">
      <img class="tm tm-light" src="assets/typemark-color.svg" alt="Qlik Sales Enablement">
    </div>
    <div class="side-mark">CAPCOM</div>
    <nav class="nav" id="nav-list"></nav>
    <div class="side-foot">
      <span id="who-label" class="who"></span>
      <button id="theme-toggle" class="theme-btn" title="Toggle light / dark" aria-label="Toggle light or dark mode">◐</button>
      <button id="signout" class="btn sm">Sign out</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
